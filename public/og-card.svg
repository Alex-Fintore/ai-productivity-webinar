<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Верните себе рабочий день</title>
  <desc id="description">Сорок рабочих часов: тридцать два остаются в неделе, восемь складываются в свободный день.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="14" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="faint">
        <feFuncA type="table" tableValues="0 0.055" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply" />
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#151515" flood-opacity="0.18" />
    </filter>
    <g id="cell">
      <rect width="48" height="48" fill="none" stroke="#151515" stroke-width="1.5" />
      <circle cx="24" cy="24" r="3" fill="#151515" />
    </g>
    <g id="free-cell">
      <rect width="48" height="48" fill="#E7432E" stroke="#151515" stroke-width="1.5" />
      <circle cx="24" cy="24" r="3" fill="#151515" />
    </g>
  </defs>

  <rect width="1200" height="630" fill="#F3F0E8" filter="url(#paper)" />
  <path d="M48 56h32M64 40v32M1120 40v42M1099 61h42" fill="none" stroke="#E7432E" stroke-width="2" />
  <path d="M48 565h24M60 553v24M1120 548v34M1103 565h34" fill="none" stroke="#151515" stroke-width="1.5" />
  <path d="M70 501H510" fill="none" stroke="#E7432E" stroke-width="3" />

  <g fill="#151515" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="82" font-weight="600" letter-spacing="-3">
    <text x="70" y="220">Верните себе</text>
    <text x="70" y="318">рабочий</text>
    <text x="70" y="416">день</text>
  </g>

  <g transform="translate(628 146)">
    <use href="#cell" x="0" y="0"/><use href="#cell" x="60" y="0"/><use href="#cell" x="120" y="0"/><use href="#cell" x="180" y="0"/><use href="#cell" x="240" y="0"/><use href="#cell" x="300" y="0"/><use href="#cell" x="360" y="0"/><use href="#cell" x="420" y="0"/>
    <use href="#cell" x="0" y="60"/><use href="#cell" x="60" y="60"/><use href="#cell" x="120" y="60"/><use href="#cell" x="180" y="60"/><use href="#cell" x="240" y="60"/><use href="#cell" x="300" y="60"/><use href="#cell" x="360" y="60"/><use href="#cell" x="420" y="60"/>
    <use href="#cell" x="0" y="120"/><use href="#cell" x="60" y="120"/><use href="#cell" x="120" y="120"/><use href="#cell" x="180" y="120"/><use href="#cell" x="240" y="120"/><use href="#cell" x="300" y="120"/><use href="#cell" x="360" y="120"/><use href="#cell" x="420" y="120"/>
    <use href="#cell" x="0" y="180"/><use href="#cell" x="60" y="180"/><use href="#cell" x="120" y="180"/><use href="#cell" x="180" y="180"/><use href="#cell" x="240" y="180"/><use href="#cell" x="300" y="180"/><use href="#cell" x="360" y="180"/><use href="#cell" x="420" y="180"/>
  </g>

  <path d="M748 410c54 27 93 31 138 16" fill="none" stroke="#E7432E" stroke-width="4" stroke-linecap="round" />
  <path d="m873 416 18 9-11 17" fill="none" stroke="#E7432E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <g transform="translate(868 460) rotate(1.2 114 54)" filter="url(#lift)">
    <rect x="-13" y="-13" width="254" height="122" fill="#F3F0E8" stroke="#151515" stroke-width="1" />
    <use href="#free-cell" x="0" y="0"/><use href="#free-cell" x="60" y="0"/><use href="#free-cell" x="120" y="0"/><use href="#free-cell" x="180" y="0"/>
    <use href="#free-cell" x="0" y="60"/><use href="#free-cell" x="60" y="60"/><use href="#free-cell" x="120" y="60"/><use href="#free-cell" x="180" y="60"/>
  </g>
</svg>
